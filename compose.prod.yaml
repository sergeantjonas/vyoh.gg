# Production stack for a single VPS. Nginx runs on the host and is the only
# ingress, so every published port binds to loopback.
#
#   docker compose -f compose.prod.yaml up -d --build
#
# `compose.yaml` (unprefixed) stays the dev file and only runs Postgres; this
# one is never loaded implicitly, hence the explicit `-f` above and the separate
# project name, so a dev stack and a prod stack cannot adopt each other's
# containers.
name: vyoh-prod

# Docker's `json-file` default has no size ceiling, so without this every
# container log grows until the disk is full. That failure is slow enough to
# arrive months after the deploy that caused it, on a box nobody is tailing,
# and it presents as the api crash-looping rather than as a log problem — so
# the cap belongs at the point of writing rather than in a trimming cron.
# 10m x 5 per service is ~150 MB across the stack, against a 160 GB disk that
# also holds the 2 GB nginx cache and the Postgres volume.
# `api` and `web` carry no `healthcheck:` key here, and that is not a gap: both
# declare `HEALTHCHECK` in their Dockerfiles. `web`'s `depends_on` reads the
# `api` one; `web`'s own surfaces in `docker ps` and gates nothing. The image is
# the better home either way — the check there resolves its port from `PORT`
# rather than restating it. `postgres` does have one below: the stock image
# ships none.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyoh}
      # No default: a production database must not come up on `vyoh:vyoh`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vyoh}
    # Loopback-published rather than internal-only, because the plan is one
    # cluster per box with a database and role per project (see
    # docs/working-notes/ops/hosting.md § Per-component conventions).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vyoh} -d ${POSTGRES_DB:-vyoh}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      # Containers are UTC by default, and this app's dates are owner-local by
      # definition (chronotype buckets, daily streak boundaries, "today").
      TZ: ${TZ:-Europe/Brussels}
      # Built here rather than read from .env: the host is `postgres` on the
      # compose network, not the `localhost` the dev DATABASE_URL points at.
      DATABASE_URL: postgresql://${POSTGRES_USER:-vyoh}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vyoh}
      PORT: 2010
      RIOT_API_KEY: ${RIOT_API_KEY:?set RIOT_API_KEY in .env}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_GRIDDB_API_KEY: ${STEAM_GRIDDB_API_KEY:-}
      # Required under NODE_ENV=production — see apps/api/src/env.ts.
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      # Owner auth. `bootstrap()` requires all four unconditionally, so without
      # them the container does not start — it is not a degraded login, it is a
      # crash loop. `:?` so compose refuses before bringing anything up, which
      # names the missing var instead of leaving it to be read out of api logs.
      OWNER_GITHUB_USER_ID: ${OWNER_GITHUB_USER_ID:?set OWNER_GITHUB_USER_ID in .env}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?set GITHUB_OAUTH_CLIENT_ID in .env}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?set GITHUB_OAUTH_CLIENT_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # The one that is *not* required: empty is its correct value when the site
      # and api share an origin, and `requireEnv` treats empty as missing. Set it
      # to `.vyoh.gg` only if api and web end up on separate subdomains.
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      MATCH_SYNC_ENABLED: ${MATCH_SYNC_ENABLED:-true}
      CUTOFF_DAYS: ${CUTOFF_DAYS:-90}
      LOL_PREWARM: ${LOL_PREWARM:-0}
      STEAM_PREWARM: ${STEAM_PREWARM:-0}
      # Error tracking. Empty is a working value: the SDK disables itself
      # without a DSN, so the api runs unreported rather than failing.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_SAMPLE_RATE: ${SENTRY_SAMPLE_RATE:-1}
      # Tags events with the build that produced them. The web image takes this
      # as a *build* arg because its bundle bakes it in; the api reads it at
      # runtime, so the same `deploy.sh` value reaches both by different routes.
      BUILD_COMMIT: ${BUILD_COMMIT:-}
    ports:
      - "127.0.0.1:${API_PORT:-2010}:2010"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time, and baked into the bundle and the markup: this is the
        # origin a browser resolves, so it is the public api hostname even
        # though the container talks to the api over the compose network.
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL in .env}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    environment:
      NODE_ENV: production
      # Load-bearing, not hygiene. Every `Intl.DateTimeFormat` in the app that
      # does not pin a `timeZone` resolves to the process's zone, so a UTC
      # server renders "Jul 12" where the browser renders "Jul 13" and React
      # throws the whole server tree away. Caught 2026-07-27 on
      # /steam/achievements, which was the only route with an unlock close
      # enough to midnight to straddle the offset.
      TZ: ${TZ:-Europe/Brussels}
      PORT: 2009
      # Runtime, and server-side only: SSR loaders reach the api directly rather
      # than back out through Nginx and the public hostname.
      API_INTERNAL_URL: http://api:2010
      # Error reporting for the SSR tier, and deliberately its *own* DSN: one
      # value shared with the api would file SSR events under the api's project
      # and collide with E3's web release tagging. Empty disables the SDK. The
      # browser DSN is a third value and a build argument, because it bakes into
      # the bundle.
      SENTRY_DSN: ${SENTRY_WEB_DSN:-}
      SENTRY_SAMPLE_RATE: ${SENTRY_SAMPLE_RATE:-1}
      # Also a build arg above, for the bundle. Read again at runtime so the SSR
      # process tags its own events with the build that produced it.
      BUILD_COMMIT: ${BUILD_COMMIT:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-2009}:2009"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:

packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
# Re-derived 2026-07-25 against the advisory set current at that date. Ranges
# track the advisory's own vulnerable range, so a widened advisory shows up as a
# fresh `pnpm audit` finding rather than being silently masked by a stale floor.
overrides:
  protobufjs@<=7.6.4: ^7.6.5
  # The advisory range is `<5.0.9`, which by semver also covers the legacy 1.x
  # and 2.x lines that minimatch pulls under @nestjs/cli. 5.0.8 ships a dual
  # ESM+CJS build, so the CJS `require()` in minimatch 3.x/9.x still resolves;
  # verified with a nest build + start. Widened from `<=5.0.7`/`^5.0.8` on
  # 2026-08-08 — GHSA-rgw5-rvv9-x895 re-broke the same DoS past the floor this
  # override had pinned, which is the case the range-tracking note above exists
  # for: the stale floor showed up as a fresh finding instead of hiding.
  brace-expansion@<5.0.9: ^5.0.9
  ws@<8.21.0: ^8.21.0
  # file-type@16 (CJS) is pinned by @jimp/core, reached via node-vibrant in
  # apps/api and tools/champion-assets; v21 is ESM-only and breaks require().
  # The advisory range starts at >=13.0.0 and so covers that pinned copy, but
  # forcing it forward breaks the import. Build-time/enrichment paths on
  # controlled inputs — risk accepted. The override still lifts every copy that
  # can move.
  file-type@>=17.0.0 <21.3.2: ^21.3.2
  "@hono/node-server@<2.0.5": ^2.0.5
  # adm-zip is the only one of these on a runtime path (steam-user, and
  # onnxruntime-node's prebuilt unpack). Crafted-ZIP OOM, so worth forcing.
  adm-zip@<0.6.0: ^0.6.0
  # Both reached only through @prisma/dev, i.e. the local Prisma dev server.
  find-my-way@<=9.6.0: ^9.6.1
  valibot@<=1.4.1: ^1.4.2
  # ajv's URI parser, one copy under both prisma and the webpack that
  # @tanstack/router-plugin drags in. ajv declares `^3.0.1`, so this stays
  # inside the range it asked for — fast-uri 4.x exists and would not.
  fast-uri@<3.1.5: ^3.1.5
  # The only runtime path of the five: steam-user reaches it through
  # socks-proxy-agent > socks. SSRF via leading-zero octets decoded as decimal,
  # and steam-user is the one place we hand a remote-controlled host to a proxy.
  # 10.3.1 was already resolved elsewhere in the tree, so this de-duplicates
  # rather than introducing a version.
  ip-address@<=10.3.0: ^10.3.1
  # Scoped to the 4.x line on purpose. The advisory covers 3.x as well, but
  # js-yaml 4 dropped `safeLoad`, so a blanket range would break any 3.x
  # consumer instead of patching it. Reached via xmlbuilder2 under
  # @tanstack/start-plugin-core.
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  # Under postcss, which declares `^3.3.11`. Selective range so the unrelated
  # nanoid 5.x copy in the tree is left where it is.
  # Widened from `<3.3.17` on 2026-09-01: GHSA-2v37-7h3g-55p8 (zero-size custom
  # generators loop forever) landed past the previous floor.
  nanoid@<3.3.18: ^3.3.18
  # The three below are build-graph only and invisible to `pnpm audit --prod`,
  # which is what CI gates on. They are here because Dependabot scans the whole
  # lockfile and cannot fix a transitive dependency in a pnpm workspace on its
  # own — it has no manifest entry to edit and does not write this block — so it
  # reports `security_update_not_possible` and the update run fails. An override
  # is the only lever, which is why they land here rather than as a lockfile bump.
  #
  # undici and hono reach the tree through `shadcn` alone (via @dotenvx/dotenvx
  # and @modelcontextprotocol/sdk > @hono/node-server respectively). Pinned to
  # their own major: undici 8 is published and nothing here asks for it.
  undici@>=7.0.0 <7.29.0: ^7.29.0
  hono@<4.12.34: ^4.12.34
  # Two parents, only one of which is shadcn — vite pulls postcss as well.
  postcss@<=8.5.22: ^8.5.23
  # Both under the prisma CLI, which pins exact versions: @prisma/config pins
  # deepmerge-ts 7.1.5 (stack exhaustion on recursive graphs) and prisma pins
  # mysql2 3.15.3 (auth-plugin downgrade — a MySQL driver this Postgres app never
  # opens). Neither is on a request path; both are on `pnpm audit --prod`'s.
  # Verified with `prisma generate` + an api build after the bump.
  deepmerge-ts@<8.0.0: ^8.0.0
  mysql2@<3.22.0: ^3.22.0
allowBuilds:
  '@biomejs/biome': true
  '@nestjs/core': true
  '@prisma/engines': true
  '@swc/core': true
  core-js: false
  esbuild: true
  msw: true
  # ONNX runtime for the face-detection anchor (apps/api). Native prebuilts
  # for x86-64 + aarch64 Linux + macOS ship from the package; this just
  # tells pnpm it's allowed to run the install hook that drops them in
  # place. Used by SteamSubjectAnchorService at enrichment time.
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true

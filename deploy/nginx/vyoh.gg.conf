# vyoh.gg — the web tier. Install to /etc/nginx/sites-available/.
#
# HTTP only. `certbot --nginx` adds the TLS server block and the :80 redirect;
# see deploy/nginx/README.md § TLS for why this file must not reference a
# certificate that does not exist yet.

upstream vyoh_web {
    server 127.0.0.1:2009;
    # Keep connections open to the SSR process. Without this every request pays
    # a fresh TCP handshake to loopback, which is cheap but not free at the
    # rate a document + 100 assets generates.
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name vyoh.gg www.vyoh.gg;

    access_log /var/log/nginx/vyoh.gg.access.log;
    error_log  /var/log/nginx/vyoh.gg.error.log;

    # The Node tier deliberately does not compress — see node-adapter.ts. This
    # is where it happens instead. `gzip_proxied any` matters: without it Nginx
    # skips compression for proxied responses, which is all of them here.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # No Content-Security-Policy yet, and that is a decision rather than an
    # omission: the app still loads images through vendor origins in places, so
    # a policy written blind would either be permissive enough to be pointless
    # or break art on a page nobody looked at. Revisit once the /img proxy is
    # the only image source (lol-image-pipeline.md § Phase 4), at which point
    # img-src collapses to 'self' data:.

    location / {
        proxy_pass http://vyoh_web;
        proxy_http_version 1.1;
        # Empty Connection header is what lets the upstream keepalive above work.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Read by the adapter to build the request URL. Certbot's TLS block makes
        # this `https`, which is what the app's absolute URLs need.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSR streams its response. Buffering would hold the shell until the
        # last chunk and hand back the whole first-paint advantage.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

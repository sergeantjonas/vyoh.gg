# api.vyoh.gg — the NestJS tier. Install to /etc/nginx/sites-available/.
#
# A separate vhost rather than a path prefix on vyoh.gg, and that is forced
# rather than stylistic: the api serves `/lol/summoners/…` while the web app
# owns `/lol/$accountSlug/…`, and no prefix rule tells an account slug apart
# from a literal route segment (see apps/web/src/lib/api-url.ts).
#
# HTTP only — `certbot --nginx` adds TLS. See deploy/nginx/README.md § TLS.

upstream vyoh_api {
    server 127.0.0.1:2010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.vyoh.gg;

    access_log /var/log/nginx/api.vyoh.gg.access.log;
    error_log  /var/log/nginx/api.vyoh.gg.error.log;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;

    # CORS is answered by Nest from WEB_ORIGIN (apps/api/src/env.ts), not here.
    # Adding `add_header Access-Control-Allow-Origin` at this layer would
    # duplicate the header on every response Nest already annotates, and a
    # doubled ACAO is treated by browsers as no ACAO at all.

    location / {
        proxy_pass http://vyoh_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Off for the whole vhost because the SSE endpoints sit under a dynamic
        # prefix — /status/stream, and
        # /lol/summoners/:region/:gameName/:tagLine/{matches,live}/events — so
        # no static `location` covers them without a regex that will rot the
        # next time a route moves. Buffering a JSON api behind a fast client
        # buys little; buffering an event stream breaks it outright.
        proxy_buffering off;
        # Long enough for an idle SSE connection to survive between events.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The image proxy: upstream fetch + sharp transcode, answering with bytes
    # that never change for a given URL. Buffering goes back on here because
    # proxy_cache does nothing without it.
    location /img/ {
        proxy_pass http://vyoh_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_buffering on;
        proxy_cache vyoh_img;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        # One in-flight request per key on a cache miss, rather than a stampede
        # of identical sharp transcodes.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

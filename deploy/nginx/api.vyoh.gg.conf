# api.vyoh.gg — the NestJS tier. Install to /etc/nginx/sites-available/.
#
# A separate vhost rather than a path prefix on vyoh.gg, and that is forced
# rather than stylistic: the api serves `/lol/summoners/…` while the web app
# owns `/lol/$accountSlug/…`, and no prefix rule tells an account slug apart
# from a literal route segment (see apps/web/src/lib/api-url.ts).
#
# HTTP only — `certbot --nginx` adds TLS. See deploy/nginx/README.md § TLS.

upstream vyoh_api {
    server 127.0.0.1:2010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.vyoh.gg;

    access_log /var/log/nginx/api.vyoh.gg.access.log;
    error_log  /var/log/nginx/api.vyoh.gg.error.log;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/xml text/plain;

    # Don't advertise the nginx version in the Server header or on error pages.
    server_tokens off;

    # NOTE: `add_header` is replaced, not merged, by any `add_header` in a
    # nested block — so a location that sets a header of its own drops every
    # header inherited from here. `location /img/` does exactly that, which is
    # why it repeats this line. Any header added here needs the same treatment
    # there, or it silently stops applying to the image proxy.
    add_header X-Content-Type-Options nosniff always;

    # CORS is answered by Nest from WEB_ORIGIN (apps/api/src/env.ts), not here.
    # Adding `add_header Access-Control-Allow-Origin` at this layer would
    # duplicate the header on every response Nest already annotates, and a
    # doubled ACAO is treated by browsers as no ACAO at all.

    location / {
        proxy_pass http://vyoh_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ~600 req/min sustained per address, absorbing a 30-request burst at
        # full speed. `nodelay` matters: without it nginx queues the burst to
        # the average rate, which would visibly slow a document's api fan-out
        # instead of just capping abuse.
        limit_req zone=api_general burst=30 nodelay;
        # The connection cap, not the request cap, is what answers the 1h
        # read timeout below — it bounds how many hour-long connections one
        # address may hold at once. Generous for a browser (HTTP/2 multiplexes
        # a page onto one connection, and the SSE routes hold two or three),
        # tight enough that holding connections open is no longer free.
        limit_conn api_conn 20;

        # Off for the whole vhost because the SSE endpoints sit under a dynamic
        # prefix — /status/stream, and
        # /lol/summoners/:region/:gameName/:tagLine/{matches,live}/events — so
        # no static `location` covers them without a regex that will rot the
        # next time a route moves. Buffering a JSON api behind a fast client
        # buys little; buffering an event stream breaks it outright.
        proxy_buffering off;
        # Long enough for an idle SSE connection to survive between events.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # OG cards: Satori layout + a native raster per request, and for the match
    # and profile cards an upstream art fetch on top. The handlers already send
    # `s-maxage=2592000`, but that header was addressed to a shared cache that
    # did not exist — every hit re-rendered. `/og/home.png` in particular takes
    # no parameters and makes no upstream call, so it was the cheapest way to
    # keep the process busy. Shares the vyoh_img zone: both are immutable bytes
    # keyed by URL, and one zone is easier to reason about than two.
    location /og/ {
        proxy_pass http://vyoh_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        limit_req zone=api_img burst=20 nodelay;
        limit_conn api_conn 20;

        add_header X-Content-Type-Options nosniff always;

        proxy_buffering on;
        proxy_cache vyoh_img;
        proxy_cache_key "$scheme$proxy_host$uri";
        # Shorter than /img/'s 30d: a card embeds profile state (rank, recent
        # form) that legitimately moves, where an image-proxy URL resolves to
        # bytes that never change.
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1h;
        # One render per key on a miss, rather than a stampede of identical
        # rasterisations when a link is first shared.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # The image proxy: upstream fetch + sharp transcode, answering with bytes
    # that never change for a given URL. Buffering goes back on here because
    # proxy_cache does nothing without it.
    location /img/ {
        proxy_pass http://vyoh_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Higher rate and a much larger burst than `location /`: one image-heavy
        # document legitimately asks for 30-60 assets at once, and limit_req is
        # evaluated before the cache lookup, so even pure cache hits count here.
        limit_req zone=api_img burst=100 nodelay;
        limit_conn api_conn 40;

        # Re-stated because this block's own `add_header` below drops everything
        # inherited from the server level. See the note there.
        add_header X-Content-Type-Options nosniff always;

        proxy_buffering on;
        proxy_cache vyoh_img;
        # Default is `$scheme$proxy_host$request_uri`, which includes the query
        # string. No route under /img/ reads a query parameter, so appending one
        # produced a byte-identical response under a brand-new cache key — an
        # unauthenticated way to force unlimited upstream fetches and sharp
        # transcodes while evicting the entries real visitors need. Keying on
        # $uri drops the query string and nothing else.
        #
        # The path segments the resolver ignores (`:patch`, `:assetTimestamp`,
        # `:schemaVersion`) deliberately stay in the key — they exist to let a
        # redeploy invalidate a browser's copy, so folding them away would break
        # invalidation to close a hole the rate limit above already covers.
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        # One in-flight request per key on a cache miss, rather than a stampede
        # of identical sharp transcodes.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

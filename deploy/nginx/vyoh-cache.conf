# http-context directives for vyoh.gg. Install to /etc/nginx/conf.d/.
#
# `proxy_cache_path` cannot appear inside a `server` block, which is the only
# reason this is a separate file from api.vyoh.gg.conf — its sole consumer is
# the `location /img/` block there.

# The api's image proxy fetches from Riot's CDN, the LoL wiki and SteamGridDB,
# then transcodes with sharp. Every one of those is expensive and every one of
# them answers with bytes that never change for a given URL, so this is the one
# place on the box where a disk cache is clearly worth its complexity.
#
# 2 GB ceiling on a 160 GB disk, inactive entries dropped after a week. keys_zone
# holds ~80k keys per 10 MB.
proxy_cache_path /var/cache/nginx/vyoh-img
                 levels=1:2
                 keys_zone=vyoh_img:10m
                 max_size=2g
                 inactive=7d
                 use_temp_path=off;

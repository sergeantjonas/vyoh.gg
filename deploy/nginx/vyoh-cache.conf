# http-context directives for vyoh.gg. Install to /etc/nginx/conf.d/.
#
# `proxy_cache_path` cannot appear inside a `server` block, which is the only
# reason this is a separate file from api.vyoh.gg.conf — its sole consumer is
# the `location /img/` block there.

# The api's image proxy fetches from Riot's CDN, the LoL wiki and SteamGridDB,
# then transcodes with sharp. Every one of those is expensive and every one of
# them answers with bytes that never change for a given URL, so this is the one
# place on the box where a disk cache is clearly worth its complexity.
#
# 2 GB ceiling on a 160 GB disk, inactive entries dropped after a week. keys_zone
# holds ~80k keys per 10 MB.
proxy_cache_path /var/cache/nginx/vyoh-img
                 levels=1:2
                 keys_zone=vyoh_img:10m
                 max_size=2g
                 inactive=7d
                 use_temp_path=off;

# Rate/connection zones for the api vhost. Defined here for the same reason as
# the cache path above — `limit_req_zone` is http-context only.
#
# The api has no authentication and several of its GETs turn one cheap request
# into a live upstream call, a permanent database row, or blocking CPU. These
# limits are what bounds all of that at once, so they are load-bearing rather
# than defensive depth. Sized against a real page load, not against a guess:
# a document fires roughly 5-20 api calls, and an image-heavy one 30-60 proxy
# requests, so the burst has to absorb a fan-out that large without ever
# throttling a genuine visitor.
#
# `$binary_remote_addr` is the true client address because nginx is the edge.
# Note this does nothing against a distributed source — that is accepted at
# this scale, and the point is to stop a single unthrottled script.
limit_req_zone  $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=api_img:10m     rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# 429 rather than nginx's 503 default: this is the client's rate, not our
# unavailability, and a crawler backs off correctly on 429.
limit_req_status  429;
limit_conn_status 429;

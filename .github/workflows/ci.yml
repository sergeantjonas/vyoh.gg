name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm ci:check

      - run: pnpm typecheck

      # Neither typecheck nor the test suite exercises this path: vitest
      # transforms via esbuild and `tsc --noEmit` never emits, so `nest build`
      # was gated by nothing. The `bundle-size` job builds only @vyoh/web.
      # Found 2026-07-26 when a typescript 7 bump passed every job here and
      # broke only this command (TS 7.0 ships `tsc` without the programmatic
      # compiler API the Nest CLI loads). Needs no database or secrets; the
      # install step above already ran `prisma generate` via api postinstall.
      - name: Build the api
        run: pnpm --filter @vyoh/api build

      # `shell: bash` is load-bearing: the default shell is `bash -e {0}` with
      # no pipefail, so `tee` exited 0 and masked vitest's failure. This step
      # could not fail between 2026-05-19 and 2026-07-25. Naming the shell opts
      # into `bash --noprofile --norc -eo pipefail {0}`.
      # `--no-bail` so a failure in the first package doesn't stop the others —
      # otherwise only one of the three lcov files reaches Codecov below.
      - name: Test with coverage
        shell: bash
        run: pnpm -r --no-bail test --coverage 2>&1 | tee coverage-output.log

      - name: Append coverage summary to step summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Coverage summary"
            echo
            if [ -s coverage-output.log ]; then
              echo '```'
              grep -E "Coverage summary|Statements|Branches|Functions|Lines|ERROR: Coverage|test:  %" coverage-output.log || tail -30 coverage-output.log
              echo '```'
            else
              echo "_No coverage output — the test step did not run._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/api/coverage/lcov.info,./apps/web/coverage/lcov.info,./packages/shared/coverage/lcov.info
          flags: api,web,shared
          fail_ci_if_error: false

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm audit --prod --audit-level=high

  bundle-size:
    name: Bundle size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @vyoh/web build

      - run: pnpm --filter @vyoh/web size

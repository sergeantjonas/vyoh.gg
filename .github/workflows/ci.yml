name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm ci:check

      - run: pnpm typecheck

      # Neither typecheck nor the test suite exercises this path: vitest
      # transforms via esbuild and `tsc --noEmit` never emits, so `nest build`
      # was gated by nothing. The `bundle-size` job builds only @vyoh/web.
      # Found 2026-07-26 when a typescript 7 bump passed every job here and
      # broke only this command (TS 7.0 ships `tsc` without the programmatic
      # compiler API the Nest CLI loads). Needs no database or secrets; the
      # install step above already ran `prisma generate` via api postinstall.
      - name: Build the api
        run: pnpm --filter @vyoh/api build

      # `shell: bash` is load-bearing: the default shell is `bash -e {0}` with
      # no pipefail, so `tee` exited 0 and masked vitest's failure. This step
      # could not fail between 2026-05-19 and 2026-07-25. Naming the shell opts
      # into `bash --noprofile --norc -eo pipefail {0}`.
      # `--no-bail` so a failure in the first package doesn't stop the others —
      # otherwise only one of the three lcov files reaches Codecov below.
      - name: Test with coverage
        shell: bash
        run: pnpm -r --no-bail test --coverage 2>&1 | tee coverage-output.log

      - name: Append coverage summary to step summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Coverage summary"
            echo
            if [ -s coverage-output.log ]; then
              echo '```'
              grep -E "Coverage summary|Statements|Branches|Functions|Lines|ERROR: Coverage|test:  %" coverage-output.log || tail -30 coverage-output.log
              echo '```'
            else
              echo "_No coverage output — the test step did not run._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The upload tolerates a missing file, so a package whose test run
      # crashed before writing lcov would be silently absent from the report —
      # that is how packages/shared alone charted as the whole repo between
      # 2026-05-31 and 2026-07-25. A package whose tests merely fail still
      # writes lcov, so this only rejects crashed or truncated runs.
      - name: Assert every package produced coverage
        id: coverage-files
        if: always()
        shell: bash
        run: |
          for f in apps/api/coverage/lcov.info apps/web/coverage/lcov.info packages/shared/coverage/lcov.info; do
            count=$(grep -c '^SF:' "$f" 2>/dev/null) || count=0
            if [ "$count" -lt 10 ]; then
              echo "::error::$f is missing or truncated ($count source files) — refusing a partial Codecov upload"
              exit 1
            fi
          done

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.coverage-files.outcome == 'success' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/api/coverage/lcov.info,./apps/web/coverage/lcov.info,./packages/shared/coverage/lcov.info
          flags: api,web,shared
          fail_ci_if_error: false

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm audit --prod --audit-level=high

  bundle-size:
    name: Bundle size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @vyoh/web build

      - run: pnpm --filter @vyoh/web size

  images:
    name: Build and push container images
    runs-on: ubuntu-latest
    needs: [check]
    # Build on every green push to main; deploying stays a deliberate owner
    # action from a local shell. Cross-workflow `needs` does not exist, which is
    # why this lives here rather than in a file of its own.
    # See docs/working-notes/ops/image-pipeline.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/sergeantjonas/vyoh-api
      WEB_IMAGE: ghcr.io/sergeantjonas/vyoh-web
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repository variables, not secrets: both are already public in the
      # served bundle. Asserted because Vite bakes them in, so an unset value
      # produces an image that builds green, pushes green, and points the whole
      # client at localhost — a failure that first surfaces in a browser.
      - name: Assert the build-arg variables are set
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          : "${VITE_API_URL:?set the VITE_API_URL repository variable}"
          : "${VITE_SITE_URL:?set the VITE_SITE_URL repository variable}"
          # A warning rather than a failure: an absent DSN disables the browser
          # SDK by design, so this must not block a build made before the Sentry
          # account exists. It is surfaced because the failure is otherwise
          # invisible — a typo, or a value set as an *environment* variable
          # rather than a repository one, both arrive here as empty and ship an
          # image that silently reports nothing. `vars` only reads environment
          # variables when the job declares `environment:`, and this one does not.
          if [ -z "${VITE_SENTRY_DSN}" ]; then
            echo "::warning::VITE_SENTRY_DSN is unset — this image reports no browser errors"
          fi

      - name: Resolve the short commit sha
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The OCI labels metadata-action emits are what link a GHCR package back
      # to this repo. Note that linking inherits access permissions, not
      # visibility: a new package is private until it is flipped once by hand,
      # and the box pulls anonymously.
      # `type=sha` is `sha-<7>`; `main` moves every push.
      - name: Tags and labels for the api image
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha
            type=raw,value=main

      # linux/amd64 only: the box is x86, and buildx sets the Dockerfile's
      # TARGETARCH from this. A multi-arch matrix buys nothing until a second
      # box exists and costs a QEMU build of Prisma and Sharp every push.
      - name: Build the api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # The one silent failure this image has is the TARGETARCH-keyed onnx
      # prune: keeping the wrong platform's runtime builds green and crashes on
      # the first Steam artwork request.
      #
      # `--entrypoint node` because the real entrypoint runs `prisma migrate
      # deploy` against a database this job has not got.
      - name: Smoke the api image
        env:
          TAG: sha-${{ steps.commit.outputs.short }}
        run: docker run --rm --entrypoint node "$API_IMAGE:$TAG" -e "require('onnxruntime-node')"

      - name: Tags and labels for the web image
        id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha
            type=raw,value=main

      # BUILD_COMMIT is a build arg here and a runtime env for the api: Vite
      # bakes it into the bundle, so the web tier cannot read it from compose.
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
            BUILD_COMMIT=${{ steps.commit.outputs.short }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_SAMPLE_RATE=${{ vars.VITE_SENTRY_SAMPLE_RATE }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
          # Sourcemap upload. The token is a secret mount rather than a build
          # arg: an ARG is readable via `docker history` on an anonymously
          # pullable package. Both web steps carry it because they share
          # `scope=web` — the build step populates the cache and the push step
          # reuses it, so a token on the push step alone would upload nothing.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Asks the image's own HEALTHCHECK question from outside, which proves
      # the type-stripping entrypoint boots away from the build context that
      # produced it. `API_INTERNAL_URL` points nowhere on purpose: a static
      # file needs no api, so reaching one would mean the probe drifted.
      - name: Smoke the web image
        shell: bash
        env:
          TAG: sha-${{ steps.commit.outputs.short }}
        run: |
          cid=$(docker run -d -p 2009:2009 \
            -e PORT=2009 \
            -e API_INTERNAL_URL=http://127.0.0.1:1 \
            "$WEB_IMAGE:$TAG")
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:2009/robots.txt >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "::error::the web image did not serve /robots.txt within 30 attempts"
            docker logs "$cid"
          fi
          docker rm -f "$cid" >/dev/null
          test "$ok" = 1

      # Both pushes sit behind both smokes. Publishing the api as soon as it
      # passed its own probe would leave a commit whose `sha-<7>` names an api
      # with no paired web image, which is the deploy-together invariant these
      # tags exist to make structural.
      #
      # Each is a second pass over a build graph the steps above already built,
      # so every layer is in the builder's cache and this only uploads.
      - name: Push the api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          # A single-platform image without attestations is a plain manifest
          # rather than an index carrying an `unknown/unknown` entry, which is
          # what keeps the GHCR package page readable.
          provenance: false

      - name: Push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
            BUILD_COMMIT=${{ steps.commit.outputs.short }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_SAMPLE_RATE=${{ vars.VITE_SENTRY_SAMPLE_RATE }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
          # Sourcemap upload. The token is a secret mount rather than a build
          # arg: an ARG is readable via `docker history` on an anonymously
          # pullable package. Both web steps carry it because they share
          # `scope=web` — the build step populates the cache and the push step
          # reuses it, so a token on the push step alone would upload nothing.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web
          provenance: false
